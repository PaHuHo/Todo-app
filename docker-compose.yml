services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: todo_backend

    working_dir: /var/www

    volumes:
      - ./backend:/var/www

    ports:
      - "8000:8000"

    depends_on:
      - mysql

    command: >
      sh -c "
      composer install &&
      php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:

    image: node:24

    container_name: todo_frontend

    working_dir: /app

    volumes:
      - ./frontend:/app

    ports:
      - "5173:5173"

    command: >
      sh -c "
      npm install &&
      npm run dev -- --host
      "

  mysql:

    image: mysql:8.4

    container_name: todo_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo_app
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: